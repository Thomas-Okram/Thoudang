# Thoudang web front: static SPA + /api reverse proxy. Runs as non-root on :8080.
# TLS: terminate at the State Data Centre load balancer, or add a `listen 8443 ssl` server here
# with the department certificate mounted read-only (see docs/deploy/SDC-DEPLOYMENT.md).

upstream thoudang_api {
    server api:3001;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Batch intake uploads up to 30 packets of phone photos in one request.
    client_max_body_size 300m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Demo reset wipes cases — never reachable in a deployment, whatever the API config says.
    location = /api/demo/reset {
        return 403;
    }

    # Server-Sent Events (live queue / pipeline progress): no buffering, long-lived.
    location = /api/events {
        proxy_pass http://thoudang_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://thoudang_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        # Extraction of a full batch can take minutes; the API itself streams progress via SSE.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA routes (/queue, /case/…, /s/<ref>, /m/upload/…) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
