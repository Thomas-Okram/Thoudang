# Thoudang — one-command on-prem run (State Data Centre VM or a district office server).
#
#   cp deploy/thoudang.env.example deploy/thoudang.env   # fill in secrets / provider
#   docker compose up -d --build
#   open http://<server>:8080
#
# Two containers, both non-root: `web` (nginx: built UI + /api proxy, the only published port)
# and `api` (Node 20, SQLite). Data lives in named volumes — back them up (docs/deploy).
#
# Optional PostgreSQL instead of SQLite (same app, DB_DRIVER=postgres; migrations run on boot):
#   THOUDANG_DB_DRIVER=postgres docker compose --profile postgres up -d --build
# Uploads, audio, templates, logs and the audit-chain anchor still live on the api volumes.

name: thoudang

services:
  api:
    build:
      context: .
      target: api
    image: thoudang-api:${THOUDANG_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: deploy/thoudang.env
        required: false
    environment:
      # Fixed by the image layout — do not override in thoudang.env.
      PORT: '3001'
      SERVE_WEB: '0'
      WEB_PORT: ${THOUDANG_HTTP_PORT:-8080}
      DB_PATH: /app/apps/api/data/thoudang.db
      UPLOADS_DIR: /app/apps/api/uploads
      LOG_FILE: /app/apps/api/logs/api.log
      AUDIO_DIR: /app/apps/api/data/audio
      TEMPLATES_PATH: /app/apps/api/data/templates/templates.json
      # sqlite (default) | postgres (`--profile postgres`, or point DATABASE_URL elsewhere).
      DB_DRIVER: ${THOUDANG_DB_DRIVER:-sqlite}
      DATABASE_URL: ${THOUDANG_DATABASE_URL:-postgres://thoudang:${THOUDANG_PG_PASSWORD:-thoudang}@postgres:5432/thoudang}
      PG_POOL_MAX: ${THOUDANG_PG_POOL_MAX:-5}
    depends_on:
      postgres:
        condition: service_healthy
        required: false # only with --profile postgres
    volumes:
      - thoudang-data:/app/apps/api/data
      - thoudang-uploads:/app/apps/api/uploads
      - thoudang-logs:/app/apps/api/logs
    # Not published: only reachable through `web`.
    expose:
      - '3001'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 60s # lets in-flight extractions finish (pipeline.whenIdle)

  web:
    build:
      context: .
      target: web
    image: thoudang-web:${THOUDANG_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${THOUDANG_BIND:-0.0.0.0}:${THOUDANG_HTTP_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thoudang
      POSTGRES_PASSWORD: ${THOUDANG_PG_PASSWORD:-thoudang}
      POSTGRES_DB: thoudang
    volumes:
      - thoudang-pg:/var/lib/postgresql/data
    # Not published: only the api reaches it, on the compose network.
    expose:
      - '5432'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thoudang -d thoudang']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  thoudang-pg: # PostgreSQL data (only with --profile postgres)
  thoudang-data: # SQLite DB (+ WAL), notice templates, cached audio — the system of record
  thoudang-uploads: # application images (contain PII; redacted only when served)
  thoudang-logs: # JSON-lines API logs (Aadhaar-redacted)
