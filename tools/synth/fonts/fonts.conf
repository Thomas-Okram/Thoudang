<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Bundled fonts ONLY, so synthetic images render identically on every machine. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">thoudang-synth-fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>PT Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>PT Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>PT Sans</family></prefer></alias>
</fontconfig>
